<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* Stamp the theme override before first paint, so there is no flash.
         No override means the OS preference (prefers-color-scheme) decides. */
      try {
        var t = localStorage.getItem('clinical-notes-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>Hx: the clinical record that fills itself in while you write</title>
    <meta name="description" content="Type or dictate a history, examination or operative note. Hx opens the right questions, ticks them off from what you wrote, and shows what is still undocumented. Nothing is ever invented. Free demo for doctors." />
    <link rel="canonical" href="https://hx.semicoded.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hx" />
    <meta property="og:url" content="https://hx.semicoded.com/" />
    <meta property="og:title" content="Hx: the record fills itself in while you write" />
    <meta property="og:description" content="Write the note. The right questions appear and tick themselves off. Nothing is ever invented. Free demo for doctors." />
    <meta property="og:image" content="https://hx.semicoded.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A clinical note beside a sheet of questions, some ticked off and some still to document." />
